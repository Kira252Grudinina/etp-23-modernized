version: '3.8'

services:
  api:
    build: .
    container_name: sexism-detector-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount models directory (so you don't rebuild when model changes)
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Gradio interface
  gradio:
    build:
      context: .
      dockerfile: Dockerfile.gradio
    container_name: sexism-detector-gradio
    ports:
      - "7860:7860"
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
    restart: unless-stopped

