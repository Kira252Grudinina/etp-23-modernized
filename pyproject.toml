[project]
name = "sexism-detector"
version = "2.0.0"
description = "Production-ready sexism detection and mitigation using transformer models"
authors = [
    {name = "Kira Grudinina", email = "grudinina.kira@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "datasets>=2.18.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "nltk>=3.8.1",
    "emoji>=2.10.0",
    "accelerate>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
    "jupyter>=1.0.0",
    "gradio>=4.20.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
